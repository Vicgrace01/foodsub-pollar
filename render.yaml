services:
  - type: web
    name: foodsub-pollar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: POLLAR_PUBLISHABLE_KEY
        sync: false
      - key: POLLAR_MERCHANT_ADDRESS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: POLLAR_NETWORK
        value: testnet
      - key: POLLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: DEMO_XLM_PER_USD
        value: "1"
      - key: COOKIE_SECURE
        value: "true"